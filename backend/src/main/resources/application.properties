# Nombre de la aplicación
spring.application.name=webtrack

# ==============================
# CONFIGURACIÓN DE BASE DE DATOS
# ==============================

# URL de conexión a la base de datos MySQL
# localhost se refiere al servidor local y 3306 es el puerto por defecto de MySQL
# webtrack_db es el nombre de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/webtrack_db

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# CONFIGURACIÓN DE JPA E HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.connection.autocommit=true

# ==============================
# CONFIGURACIÓN DE SEEDING (Carga de datos iniciales)
# ==============================

# Indica si se debe ejecutar un proceso de carga de datos iniciales al iniciar la aplicación
seed.database.enabled=true

# ID del estado inicial de un candidatura (preconfiguración)
estado.candidatura.inicial-id=1

spring.main.allow-bean-definition-overriding=true
